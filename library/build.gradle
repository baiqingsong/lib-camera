plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk 34
    namespace "com.dawn.filter"

    defaultConfig {
        minSdk 28
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.baiqingsong'
                artifactId = 'lib-camera'
                version = '1.0.0'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'

    // GPUImage - 核心滤镜引擎（内置 Camera API 支持）
    api 'jp.co.cyberagent.android:gpuimage:2.1.0'

    // TensorFlow Lite - AI 超分辨率推理
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    // ML Kit - 人像分割，支持背景透明抠图
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'

    // ML Kit - 人脸检测，用于抠图时约束主体区域（剔除椅子等误识别前景）
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // ONNX Runtime - 运行 RVM 人像抠图模型（源分辨率 alpha matte，发丝级边缘）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
}